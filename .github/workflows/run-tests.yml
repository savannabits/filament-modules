name: run-tests

on:
  push:
    branches: [ main, 5.x, 'feature/**' ]
  pull_request:
    branches: [ main, 5.x ]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: ^12.0
            testbench: ^10.0
            os: ubuntu-latest
          - php: '8.4'
            laravel: ^12.0
            testbench: ^10.0
            os: ubuntu-latest
          - php: '8.3'
            laravel: ^13.10
            testbench: ^11.0
            pest: ^4.4
            pest-plugin-laravel: ^4.0
            pest-plugin-livewire: ^4.0
            os: ubuntu-latest
          - php: '8.4'
            laravel: ^13.10
            testbench: ^11.0
            pest: ^4.4
            pest-plugin-laravel: ^4.0
            pest-plugin-livewire: ^4.0
            os: ubuntu-latest
          - php: '8.5'
            laravel: ^12.0
            testbench: ^10.0
            os: ubuntu-latest
          - php: '8.5'
            laravel: ^13.10
            testbench: ^11.0
            pest: ^4.4
            pest-plugin-laravel: ^4.0
            pest-plugin-livewire: ^4.0
            os: ubuntu-latest
          - php: '8.3'
            laravel: ^12.0
            testbench: ^10.0
            os: windows-latest

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        shell: bash
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          PACKAGES=(
            "laravel/framework:${{ matrix.laravel }}"
            "orchestra/testbench:${{ matrix.testbench }}"
          )

          if [ -n "${{ matrix.pest }}" ]; then
            PACKAGES+=("pestphp/pest:${{ matrix.pest }}")
          fi

          if [ -n "${{ matrix.pest-plugin-laravel }}" ]; then
            PACKAGES+=("pestphp/pest-plugin-laravel:${{ matrix.pest-plugin-laravel }}")
          fi

          if [ -n "${{ matrix.pest-plugin-livewire }}" ]; then
            PACKAGES+=("pestphp/pest-plugin-livewire:${{ matrix.pest-plugin-livewire }}")
          fi

          composer require "${PACKAGES[@]}" --dev --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-scripts
          composer dump-autoload

      - name: Run tests
        shell: bash
        run: vendor/bin/pest --ci
