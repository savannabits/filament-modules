name: run-tests

on:
  push:
    branches: [ main, 5.x, 'feature/**' ]
  pull_request:
    branches: [ main, 5.x ]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: ^12.0
            testbench: ^10.0
            pest: ^3.8
            pest-laravel: ^3.1
            pest-livewire: ^3.0
            os: ubuntu-latest
          - php: '8.4'
            laravel: ^12.0
            testbench: ^10.0
            pest: ^3.8
            pest-laravel: ^3.1
            pest-livewire: ^3.0
            os: ubuntu-latest
          - php: '8.3'
            laravel: ^13.0
            testbench: ^11.0
            pest: ^4.4
            pest-laravel: ^4.1
            pest-livewire: ^4.1
            os: ubuntu-latest
          - php: '8.4'
            laravel: ^13.0
            testbench: ^11.0
            pest: ^4.4
            pest-laravel: ^4.1
            pest-livewire: ^4.1
            os: ubuntu-latest
          - php: '8.3'
            laravel: ^12.0
            testbench: ^10.0
            pest: ^3.8
            pest-laravel: ^3.1
            pest-livewire: ^3.0
            os: windows-latest

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          composer require \
            "laravel/framework:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}" \
            "pestphp/pest-plugin-laravel:${{ matrix.pest-laravel }}" \
            "pestphp/pest-plugin-livewire:${{ matrix.pest-livewire }}" \
            --dev \
            --no-interaction \
            --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-scripts
          composer dump-autoload

      - name: Run tests
        run: vendor/bin/pest --ci
