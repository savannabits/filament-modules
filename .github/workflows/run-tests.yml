name: run-tests

on:
  push:
    branches: [ main, 5.x, 'feature/**' ]
  pull_request:
    branches: [ main, 5.x ]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            os: ubuntu-latest
          - php: '8.4'
            os: ubuntu-latest
          - php: '8.3'
            os: windows-latest

    name: PHP ${{ matrix.php }} · Laravel 12 · ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, exif, iconv, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        env:
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          composer require \
            "laravel/framework:^12.0" \
            "orchestra/testbench:^10.0" \
            --dev \
            --no-interaction \
            --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-scripts
          composer dump-autoload

      - name: Run tests
        run: vendor/bin/pest --ci
